<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Memories 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#ffd1dc,#ff7aa2,#ff2e63);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* MAIN BOX */
.box{
  background:rgba(255,255,255,.95);
  padding:50px;
  border-radius:40px;
  max-width:560px;
  text-align:center;
  z-index:5;
  box-shadow:
    0 0 30px #fff,
    0 0 80px rgba(255,46,99,.6),
    0 0 140px rgba(255,46,99,.4);
  animation:pulseBox 3s infinite;
}

@keyframes pulseBox{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.03)}
}

h1{
  color:#ff2e63;
  font-size:32px;
  text-shadow:0 0 20px #ff7aa2;
}

#typing{
  margin:15px 0;
  font-size:18px;
  min-height:60px;
}

.memories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin:20px 0;
}

.card{
  padding:22px;
  border-radius:24px;
  font-size:15px;
  background:linear-gradient(135deg,#ff5f8f,#ff2e63);
  color:white;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,46,99,.8);
  transition:.4s;
}

.card:hover{
  transform:scale(1.12) rotate(-1deg);
  box-shadow:0 0 50px rgba(255,46,99,1);
}

.note{
  display:none;
  margin:15px 0;
  font-weight:600;
  color:#ff2e63;
  text-shadow:0 0 10px #ffd1dc;
}

#line{
  font-size:18px;
  min-height:40px;
}
#question{
  color:#ff2e63;
  font-weight:600;
  margin-top:8px;
}

/* BUTTONS */
.buttons{
  display:flex;
  justify-content:space-between;
  margin-top:25px;
}

button{
  padding:14px 32px;
  border:none;
  border-radius:50px;
  background:#ff2e63;
  color:white;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 0 35px rgba(255,46,99,.9);
  animation:beat 1.6s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.15)}
}

/* PARTICLES */
.heart,.spark,.orb{
  position:fixed;
  pointer-events:none;
}

.heart{
  font-size:26px;
  animation:floatUp 4s forwards;
}

@keyframes floatUp{
  to{transform:translateY(-140px) rotate(360deg);opacity:0}
}

.spark{
  width:6px;height:6px;
  background:white;
  border-radius:50%;
  animation:spark 1s forwards;
}

@keyframes spark{
  to{transform:translateY(-30px);opacity:0}
}

.orb{
  width:8px;height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.6);
  box-shadow:0 0 15px white;
}

/* NIGHT TOGGLE */
#night{
  position:fixed;
  top:20px;
  right:20px;
  background:#111;
  color:white;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  z-index:10;
}
</style>
</head>

<body>

<div id="night">🌙</div>

<div class="box" id="box">
  <h1>Our Little Memories 💞</h1>
  <p id="typing"></p>

  <div class="memories">
    <div class="card" onclick="showNote(0)">🌸 First Smile</div>
    <div class="card" onclick="showNote(1)">💬 Late Talks</div>
    <div class="card" onclick="showNote(2)">✨ Small Moments</div>
    <div class="card" onclick="showNote(3)">💖 You & Me</div>
  </div>

  <div class="note" id="note"></div>

  <p id="line"></p>
  <p id="question"></p>

  <div class="buttons">
    <button onclick="back()">⬅ Back</button>
    <button onclick="next()">Ghulami 💖</button>
  </div>
</div>

<script>
/* INTRO TYPE */
const intro="Some memories don’t fade… they become part of the soul 💗";
let i=0;
(function type(){
  if(i<intro.length){
    typing.innerHTML+=intro[i++];
    setTimeout(type,50);
  }
})();

/* NOTES */
const notes=[
 "Your smile changed everything 🌸",
 "Late talks that felt like forever 💬",
 "Small moments that mean everything ✨",
 "You are my favorite feeling 💖"
];
function showNote(n){
  note.style.display="block";
  note.innerText=notes[n];
  megaBurst();
}

/* LINES */
const lines=[
 "Manahil, you feel like home 💖",
 "My heart chose you silently ✨",
 "With you, everything feels right ❤️",
 "You are my always 💞"
];
const questions=[
 "What memory of us do you love most?",
 "What makes us special?",
 "Can you feel my heart here?",
 "Do you believe in forever?"
];
let l=0,c=0,q=0;
setInterval(()=>{
  if(c<lines[l].length){
    line.innerText+=lines[l][c++];
  }else{
    setTimeout(()=>{
      line.innerText="";
      c=0;
      l=(l+1)%lines.length;
      question.innerText=questions[q];
      q=(q+1)%questions.length;
    },1600);
  }
},80);

/* HEART RAIN */
setInterval(()=>{
  let h=document.createElement('div');
  h.className='heart';
  h.innerText=Math.random()>.5?'💖':'🌹';
  h.style.left=Math.random()*100+'vw';
  h.style.top='90vh';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
},400);

/* CURSOR MAGIC */
document.addEventListener('mousemove',e=>{
  let s=document.createElement('div');
  s.className='spark';
  s.style.left=e.clientX+'px';
  s.style.top=e.clientY+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1000);
});

/* MEGA BURST */
function megaBurst(){
  for(let k=0;k<25;k++){
    let h=document.createElement('div');
    h.className='heart';
    h.innerText='💗';
    h.style.left=45+Math.random()*10+'vw';
    h.style.top='60vh';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}

/* NIGHT MODE */
let dark=false;
night.onclick=()=>{
  dark=!dark;
  document.body.style.background=dark
  ?'radial-gradient(circle,#0f2027,#203a43,#2c5364)'
  :'radial-gradient(circle at top,#ffd1dc,#ff7aa2,#ff2e63)';
};

/* NAVIGATION */
function back(){location.href="index.html"}
function next(){location.href="ghulam.html"}  // ← Updated
</script>

</body>
</html>
