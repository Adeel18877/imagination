<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forever Proposal 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}

body{
  height:100vh;
  background:linear-gradient(270deg,#ffb6c1,#ff69b4,#ff1493,#ff87a2);
  background-size:800% 800%;
  animation:bg 20s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* BACKGROUND ANIMATION */
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* NIGHT TOGGLE */
#night{
  position:fixed;
  top:18px;
  right:18px;
  padding:8px 14px;
  border-radius:20px;
  background:#333;
  color:white;
  cursor:pointer;
  z-index:10;
  box-shadow:0 0 20px rgba(0,0,0,.5);
}

/* MAIN BOX */
.box{
  background:rgba(255,255,255,.95);
  padding:60px;
  border-radius:50px;
  text-align:center;
  box-shadow:0 40px 120px rgba(255,46,99,.5);
  max-width:560px;
  position:relative;
  z-index:2;
  animation:fade 1.5s;
}

@keyframes fade{
  from{opacity:0;transform:translateY(50px) scale(.9)}
  to{opacity:1}
}

/* RING ICON */
.ring{
  font-size:90px;
  animation:pulse 1.2s infinite alternate;
  margin-bottom:12px;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.5) rotate(6deg)}
  100%{transform:scale(1)}
}

/* HEADING */
h1{
  color:#ff1493;
  font-size:28px;
  margin-bottom:10px;
  text-shadow:
    0 0 15px #fff,
    0 0 40px #ff69b4,
    0 0 90px #ff1493;
  animation:glowText 2s infinite alternate;
}
@keyframes glowText{
  0%{text-shadow:0 0 20px #fff,0 0 40px #ff69b4,0 0 80px #ff1493}
  100%{text-shadow:0 0 50px #fff,0 0 120px #ff69b4,0 0 200px #ff1493}
}

/* QUESTION TEXT */
#question{
  font-size:18px;
  color:#ff1493;
  font-weight:700;
  min-height:30px;
  margin-bottom:20px;
}

/* BUTTONS */
.buttons{margin-top:30px}

button{
  margin:10px;
  padding:16px 40px;
  border:none;
  border-radius:50px;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

.yes{
  background:linear-gradient(135deg,#ff69b4,#ff1493,#ff87a2);
  color:white;
  box-shadow:0 0 40px #ff69b4,0 0 90px #ff1493,0 0 150px #ff87a2;
  animation:glow 2s infinite;
}
@keyframes glow{
  0%{box-shadow:0 0 20px #ff69b4,0 0 50px #ff1493,0 0 80px #ff87a2}
  50%{box-shadow:0 0 70px #ff69b4,0 0 150px #ff1493,0 0 200px #ff87a2}
  100%{box-shadow:0 0 20px #ff69b4,0 0 50px #ff1493,0 0 80px #ff87a2}
}

.no{
  background:#eee;
  position:relative;
  color:#333;
}

button:hover{transform:scale(1.15)}

/* MESSAGE AFTER YES */
#msg{
  margin-top:25px;
  font-size:22px;
  color:#ff1493;
  font-weight:700;
  opacity:0;
  transform:scale(.8);
  transition:1s;
}

/* PARTICLES */
.rose,.heart,.spark{
  position:fixed;
  pointer-events:none;
}

.heart,.rose{
  font-size:30px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);opacity:0}
}

.spark{
  width:6px;height:6px;
  background:white;
  border-radius:50%;
  animation:sparkAnim 1s forwards;
}
@keyframes sparkAnim{
  to{transform:translateY(-30px);opacity:0}
}
</style>
</head>

<body>

<div id="night">🌙</div>

<div class="box">
  <div class="ring">💍</div>
  <h1>Manahil, Will You Be Mine Forever?</h1>
  <p id="question"></p>

  <div class="buttons">
    <button class="yes" onclick="yes()">Yes Adeel 💖</button>
    <button class="no" onmouseover="move(this)">No 🙈</button>
  </div>

  <div id="msg">My heart is officially yours now ❤️✨</div>
</div>

<script>
// sparkle cursor
document.addEventListener('mousemove',e=>{
  let s=document.createElement('div');
  s.className='spark';
  s.style.left=e.clientX+'px';
  s.style.top=e.clientY+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1000);
});

// floating roses & hearts
setInterval(()=>{
  let r=document.createElement('div');
  r.className=Math.random()>.5?'rose':'heart';
  r.innerText=Math.random()>.5?'🌹':'💖';
  r.style.left=Math.random()*100+'vw';
  r.style.fontSize=(20+Math.random()*40)+'px';
  r.style.animationDuration=(2+Math.random()*3)+'s';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),5000);
},300);

// night mode
let dark=false;
night.onclick=()=>{
  dark=!dark;
  document.body.style.background=dark
   ?'linear-gradient(135deg,#0f2027,#203a43,#2c5364)'
   :'linear-gradient(270deg,#ffb6c1,#ff69b4,#ff1493,#ff87a2)';
};

// romantic + funny questions
const questions=[
 "Do you feel butterflies too? 🦋",
 "Should we annoy each other forever? 😄",
 "Can I steal all your smiles? 💕",
 "Ready for endless memories? ✨",
 "Is your heart saying yes already? 💖"
];
let qi=0;
setInterval(()=>{
  question.innerText=questions[qi];
  qi=(qi+1)%questions.length;
},3500);

// YES mega heart blast
function yes(){
  msg.style.opacity=1;
  msg.style.transform='scale(1)';

  for(let i=0;i<180;i++){
    setTimeout(()=>{
      let h=document.createElement('div');
      h.className=Math.random()>.5?'heart':'rose';
      h.innerText=Math.random()>.5?'💖':'🌹';
      h.style.left=Math.random()*100+'vw';
      h.style.fontSize=(25+Math.random()*60)+'px';
      h.style.animationDuration=(1+Math.random()*3)+'s';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),5000);
    },i*15);
  }
}

// NO escape
function move(b){
  b.style.position='absolute';
  b.style.top=Math.random()*70+'%';
  b.style.left=Math.random()*70+'%';
}
</script>

</body>
</html>
