<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Our Private Dictionary ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ff1e4d,#ff99ac);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* Heading */
.header{
  position:absolute;
  top:40px;
  text-align:center;
}

.header h1{
  font-size:55px;
  color:#fff0f5;
  text-shadow:
    0 0 20px #ff4d6d,
    0 0 40px #ff99ac,
    0 0 80px #ff1e4d;
  font-weight:800;
}

/* Meaning box under heading */
.meaning-box{
  display:none;
  position:absolute;
  top:130px;
  background:rgba(255,255,255,0.25);
  padding:25px 45px;
  border-radius:30px;
  max-width:650px;
  text-align:center;
  font-size:20px;
  line-height:1.9;
  color:white;
  backdrop-filter:blur(10px);
  box-shadow:
    0 0 60px #ff4d6d,
    0 0 120px #ff99ac;
  animation:fade 0.4s ease-in-out;
}

@keyframes fade{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

/* Options Center */
.options-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:35px;
}

/* First Row */
.row{
  display:flex;
  gap:40px;
  justify-content:center;
}

/* Cards */
.card{
  background:rgba(255,0,70,0.35);
  padding:35px 40px;
  border-radius:25px;
  text-align:center;
  cursor:pointer;
  width:190px;
  font-weight:700;
  box-shadow:0 0 35px #ff4d6d;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.1);
  box-shadow:
    0 0 70px #ff4d6d,
    0 0 140px #ff99ac;
}

.card h3{
  color:white;
  font-size:22px;
  text-shadow:0 0 15px #fff;
}

/* Bottom Button (options ke neeche) */
.bottom-link{
  position: relative;  /* absolute se relative */
  margin-top:50px;     /* options ke neeche gap */
  text-align:center;   /* center align */
}

.bottom-link button{
  padding:15px 35px;
  border:none;
  border-radius:30px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(45deg,#ff1e4d,#ff99ac);
  color:white;
  box-shadow:
    0 0 25px #ff4d6d,
    0 0 60px #ff99ac;
  transition:0.3s;
}

.bottom-link button:hover{
  transform:scale(1.1);
  box-shadow:
    0 0 60px #ff4d6d,
    0 0 120px #ff99ac;
}

/* Falling Hearts */
.heart{
  position:fixed;
  top:-10px;
  color:#ff1e4d;
  font-size:20px;
  animation:fall linear infinite;
  text-shadow:
    0 0 15px #ff4d6d,
    0 0 30px #ff99ac,
    0 0 60px #ff1e4d;
  pointer-events:none;
}

@keyframes fall{
  to{ transform:translateY(110vh); }
}
</style>
</head>

<body>

<div class="header">
  <h1>📖 Our Private Dictionary ❤️</h1>
</div>

<div class="meaning-box" id="meaningBox"></div>

<div class="options-wrapper">
  <div class="row" id="row1"></div>
  <div class="row" id="row2"></div>

  <!-- Button ab options ke neeche hai -->
  <div class="bottom-link">
    <a href="ghulam.html">
      <button>Ghulami ❤️</button>
    </a>
  </div>
</div>

<script>
const words = [
  ["Diva","👑 Meri life ki queen, meri har khushi ka reason ❤️"],
  ["Hug","🤗 System restart — sab kuch perfect ho jata hai ❤️"],
  ["Kiss","💋 Magic touch jo din ko special bana de ❤️"],
  ["Smile","🌸 Tumhari smile meri energy boost hai ❤️"],
  ["Forever","💍 Sirf tumhare naam ka word — always & forever ❤️"]
];

const row1 = document.getElementById("row1");
const row2 = document.getElementById("row2");
const meaningBox = document.getElementById("meaningBox");

words.forEach((w,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML="<h3>"+w[0]+"</h3>";
  card.onclick=()=>{
    meaningBox.style.display="block";
    meaningBox.innerHTML=w[1];
  };

  if(i<3) row1.appendChild(card);
  else row2.appendChild(card);
});

/* Falling Hearts */
for(let i=0;i<30;i++){
  let heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💕";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=3+Math.random()*3+"s";
  heart.style.fontSize=15+Math.random()*20+"px";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
